# Deploy the static slideshows to GitHub Pages.
# Creating the Pages site needs a repo admin, which this token does not have.
# Until an owner enables Pages, this workflow exits successfully and does not deploy.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Pages site
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          body=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/tmp/pages-err)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Pages is not enabled. An owner must turn it on under Settings, Pages."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build=$(printf '%s' "$body" | jq -r '.build_type // empty')
          echo "Pages build_type=${build}"
          if [ "$build" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pages is publishing from a branch, so this workflow has nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.site.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: steps.site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.site.outputs.ready == 'true'
        uses: actions/deploy-pages@v5
