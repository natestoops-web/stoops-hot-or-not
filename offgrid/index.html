function copy(t){const fb=()=>{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();ok?toast('Code copied. Paste it into a text message.'):prompt('Copy this code:',t)};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Code copied. Paste it into a text message.'),fb)}else fb()}
function msgText(c){let t=H.title+' votes ('+H.summary()+'). Open the slideshow, tap Share / Load votes, then Load votes, and paste this:\n\n'+c;
 if(/^https?:$/.test(location.protocol))t+='\n\nOr tap: '+location.href.split('#')[0]+'#v='+c;return t}
document.getElementById('honShare').onclick=()=>{const c=makeCode(),t=msgText(c);
 if(navigator.share){navigator.share({title:H.title+' votes',text:t}).catch(e=>{if(e&&e.name!=='AbortError')copy(c)})}else copy(c)};
document.getElementById('honCopy').onclick=()=>copy(makeCode());
document.getElementById('honDl').onclick=()=>{const j=JSON.stringify(H.exp());const bl=new Blob([j],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=H.fname();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)};
document.getElementById('honLoad').onclick=()=>load(document.getElementById('honIn').value);
document.getElementById('honFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f);e.target.value=''};
window.HONbox=()=>`<div class="honBox"><div class="how">${HOW}</div><div class="r"><button onclick="HONopen();document.getElementById('honShare').scrollIntoView()">📤 Share votes</button><button onclick="HONopen();setTimeout(()=>document.getElementById('honIn').focus(),50)">📥 Load votes</button></div></div>`;
H.after();
// shared link: #v=CODE
const h=location.hash;if(/^#v=/.test(h)){const code=decodeURIComponent(h.slice(3));history.replaceState(null,'',location.pathname+location.search);
 setTimeout(()=>{if(confirm('Someone shared votes with you. Load them into this slideshow?'))load(code)},300)}
})();
